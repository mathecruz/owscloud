# LocalStack via Dev Services for Amazon Services (dev and test modes).
# The port is fixed because aws.dynamodb.endpoint points the workflow calls to http://localhost:4566/.
quarkus.aws.devservices.provider=localstack
quarkus.aws.devservices.localstack.image-name=localstack/localstack:4.13
quarkus.aws.devservices.localstack.port=4566
quarkus.aws.devservices.localstack.init-scripts-folder=src/test/resources/localstack-init
quarkus.aws.devservices.localstack.init-completion-msg=#### orders table created

# DynamoDB endpoint of the workflows, read with ${ $secret.aws.dynamodb.endpoint } (use.secrets: [aws]).
# Can be overridden with the AWS_DYNAMODB_ENDPOINT environment variable.
aws.dynamodb.endpoint=https://dynamodb.us-east-1.amazonaws.com/
%dev,test.aws.dynamodb.endpoint=http://localhost:4566/

# AWS calls of the workflows are signed with SigV4 by AwsSigV4ClientFilter, registered on the named
# HTTP client "aws" of the workflows listed in owscloud.aws.workflows; in prod the
# credentials come from the default chain (env vars, ~/.aws, IAM role).
owscloud.aws.workflows=default:dynamodb-put-item:0.1.0
quarkus.flow.http.client.workflow.dynamodb-put-item.name=aws
# A named client without any property falls back to the default client, which would be signed too
quarkus.flow.http.client.named.aws.read-timeout=10000
quarkus.flow.http.client.named.aws.logging.scope=all
quarkus.flow.http.client.named.aws.logging.body-limit=4096
owscloud.aws.region=us-east-1
%dev,test.owscloud.aws.access-key-id=test
%dev,test.owscloud.aws.secret-access-key=test

# Dev mode against the real AWS table: ./mvnw quarkus:dev -Dquarkus.profile=dev,real-aws
%real-aws.aws.dynamodb.endpoint=https://dynamodb.us-east-1.amazonaws.com/
%real-aws.owscloud.aws.access-key-id=
%real-aws.owscloud.aws.secret-access-key=
%real-aws.quarkus.dynamodb.devservices.enabled=false

# Log the Quarkus Flow HTTP calls, including the response body of errors.
quarkus.flow.http.client.logging.scope=all
quarkus.flow.http.client.logging.body-limit=4096
quarkus.log.category."org.jboss.resteasy.reactive.client.logging".level=DEBUG


quarkus.log.category."io.quarkiverse.flow.recorders.WorkflowApplicationCreator".level=DEBUG